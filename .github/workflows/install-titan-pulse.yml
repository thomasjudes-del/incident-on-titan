name: Install validated Titan Pulse MP3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-titan-pulse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify exact MP3
        shell: bash
        run: |
          mkdir -p assets/audio
          curl --fail --location --retry 3 --output assets/audio/ioti-titan-pulse-v1.mp3 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-83a8-81fd-b5bb-18b57cbadc00/raw?se=2026-08-04T10:17:24Z&sp=r&sv=2026-02-06&sr=b&scid=07340c6f-c74f-5bfb-812c-ee85370bda22&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T08:25:57Z&ske=2026-08-05T08:25:57Z&sks=b&skv=2026-02-06&sig=S7WYnPlplgYPpez2cgHWIxkn/%2B7e0bUO9LbyAsUG0ak%3D'
          test "$(wc -c < assets/audio/ioti-titan-pulse-v1.mp3 | tr -d ' ')" = '1230096'
          echo 'd59bfbf9e6a823d4bbedea27c47b85fec521f302f47ce3ccda80c8410486a25d  assets/audio/ioti-titan-pulse-v1.mp3' | sha256sum --check --strict
          file assets/audio/ioti-titan-pulse-v1.mp3

      - name: Install minimal Safari-safe player
        shell: bash
        run: |
          cat > music.js <<'JS'
          (() => {
            'use strict';

            const app = document.querySelector('#app');
            if (!app) return;

            const music = document.createElement('audio');
            music.src = 'assets/audio/ioti-titan-pulse-v1.mp3?v=37';
            music.loop = true;
            music.preload = 'auto';
            music.volume = 0.55;
            music.playsInline = true;
            music.setAttribute('playsinline', '');
            music.load();

            let started = false;

            function startMusic() {
              if (started) return;
              const playback = music.play();
              if (playback && typeof playback.then === 'function') {
                playback
                  .then(() => { started = true; })
                  .catch(error => console.error('Titan Pulse MP3 could not start.', error));
              } else {
                started = true;
              }
            }

            document.addEventListener('click', event => {
              const button = event.target.closest('button.primary');
              if (!button || started) return;
              const stage = app.dataset.stage;
              if (stage === 'home' || stage === 'brief') startMusic();
            }, true);

            document.addEventListener('visibilitychange', () => {
              if (!started) return;
              if (document.hidden) music.pause();
              else music.play().catch(() => {});
            });

            window.IOTI_AUDIO = { play: startMusic };
          })();
          JS

          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          import re
          text = re.sub(r'\?v=\d+', '?v=37', text)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit verified binary and player
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/ioti-titan-pulse-v1.mp3 music.js index.html
          git commit -m 'Install verified Titan Pulse MP3 binary'
          git push
