name: Materialize Titan Pulse MP3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-titan-pulse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the exact validated MP3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          expected_size = 1230096
          expected_sha256 = 'd59bfbf9e6a823d4bbedea27c47b85fec521f302f47ce3ccda80c8410486a25d'

          pairs = [
              ('assets/audio/titan-pulse-v1-00.txt', 'assets/audio/titan-pulse-v1-01.txt'),
              ('assets/audio/titan-pulse-v1-game-00.txt', 'assets/audio/titan-pulse-v1-game-01.txt'),
          ]

          def clean(path):
              return ''.join(Path(path).read_text(encoding='utf-8').split())

          def decode_piece(text):
              text += '=' * ((4 - len(text) % 4) % 4)
              return base64.b64decode(text, validate=False)

          candidates = []
          for first_path, second_path in pairs:
              if not Path(first_path).exists() or not Path(second_path).exists():
                  continue
              first = clean(first_path)
              second = clean(second_path)

              # The repository has contained chunks produced in more than one way.
              # Test both valid reconstruction strategies and select only the file
              # whose checksum exactly matches the MP3 approved before integration.
              try:
                  candidates.append((f'{first_path}+{second_path}:joined-text', decode_piece(first + second)))
              except Exception:
                  pass
              try:
                  candidates.append((f'{first_path}+{second_path}:joined-bytes', decode_piece(first) + decode_piece(second)))
              except Exception:
                  pass

          for label, data in candidates:
              digest = hashlib.sha256(data).hexdigest()
              print(label, len(data), digest)
              if len(data) == expected_size and digest == expected_sha256:
                  output = Path('assets/audio/ioti-titan-pulse-v1.mp3')
                  output.write_bytes(data)
                  print('Validated MP3 reconstructed:', output)
                  break
          else:
              raise SystemExit('None of the stored chunk combinations matches the validated MP3.')
          PY

      - name: Install the minimal direct MP3 player
        shell: bash
        run: |
          cat > music.js <<'JS'
          (() => {
            'use strict';

            const app = document.querySelector('#app');
            if (!app) return;

            const music = new Audio('assets/audio/ioti-titan-pulse-v1.mp3?v=35');
            music.loop = true;
            music.preload = 'auto';
            music.volume = 0.28;
            music.playsInline = true;
            music.setAttribute('playsinline', '');

            let started = false;
            let starting = false;

            async function startMusic() {
              if (started || starting) return;
              starting = true;
              try {
                await music.play();
                started = true;
              } catch (error) {
                console.error('Titan Pulse MP3 could not start.', error);
              } finally {
                starting = false;
              }
            }

            document.addEventListener('click', event => {
              const button = event.target.closest('button.primary');
              if (!button || started || starting) return;
              const stage = app.dataset.stage;
              if (stage === 'home' || stage === 'brief') startMusic();
            }, true);

            document.addEventListener('visibilitychange', () => {
              if (!started) return;
              if (document.hidden) music.pause();
              else music.play().catch(() => {});
            });

            window.IOTI_AUDIO = { play: startMusic };
          })();
          JS

          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          for version in range(25, 35):
              text = text.replace(f'?v={version}', '?v=35')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit binary audio and direct player
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/ioti-titan-pulse-v1.mp3 music.js index.html
          git commit -m 'Use validated Titan Pulse MP3 binary' || exit 0
          git push
