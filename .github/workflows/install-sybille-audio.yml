name: Install verified Sybille takeover audio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify audio binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          curl -fL 'https://sdmntpreastus.oaiusercontent.com/files/00000000-c180-81f9-924a-02d022b206e8/raw?se=2026-08-04T10:53:23Z&sp=r&sv=2026-02-06&sr=b&scid=a7671447-d72d-566e-80b8-87157302a51d&skoid=b32d65cd-c8f1-46fb-90df-c208671889d4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T06:03:07Z&ske=2026-08-05T06:03:07Z&sks=b&skv=2026-02-06&sig=JBc2o3wXyo9YMuZvfJoHfE0k0uxfY0RmUPqh0rvHM%2B4%3D' -o assets/audio/ioti-titan-pulse-v1-dark.mp3
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-a0e4-81f4-ac99-36892e2a81ba/raw?se=2026-08-04T10:53:41Z&sp=r&sv=2026-02-06&sr=b&scid=d546ffeb-ec89-5728-b8b1-911224361f5b&skoid=b32d65cd-c8f1-46fb-90df-c208671889d4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T21:56:44Z&ske=2026-08-04T21:56:44Z&sks=b&skv=2026-02-06&sig=oLlJB2s1M8rlkCD%2BO7p/Evar0W831792E6Z5VP1qCUk%3D' -o assets/audio/sybille-takeover-whoosh.mp3
          echo 'ac78baedd327c87bf8e369b12a671778015bcf0ed5331b6355bb9d3787fe314d  assets/audio/ioti-titan-pulse-v1-dark.mp3' | sha256sum -c -
          echo '6a5eefd109830260b09351a6723f1039d8a7874c0404f9f771293ab380b3c1cd  assets/audio/sybille-takeover-whoosh.mp3' | sha256sum -c -
      - name: Commit verified audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/ioti-titan-pulse-v1-dark.mp3 assets/audio/sybille-takeover-whoosh.mp3
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add verified Sybille takeover audio binaries'
          git push
