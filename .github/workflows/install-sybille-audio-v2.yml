name: Install verified Sybille audio v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Sybille audio v2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          curl -fL 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-3c18-8246-ae10-9ffcd2599015/raw?se=2026-08-04T12:17:38Z&sp=r&sv=2026-02-06&sr=b&scid=77c21560-475d-5644-9938-22d42a1d3809&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T07:02:40Z&ske=2026-08-05T07:02:40Z&sks=b&skv=2026-02-06&sig=Fa82XyB2Mb9xCd%2BaHK4HsPyJNMQe6yC6biEvx6NdRSM%3D' -o assets/audio/ioti-titan-pulse-v1-dark.mp3
          curl -fL 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-d2a8-81fb-8013-0b8d31e9a41f/raw?se=2026-08-04T12:17:59Z&sp=r&sv=2026-02-06&sr=b&scid=65a8440d-9408-586a-9d15-a68fe08bb484&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T07:04:45Z&ske=2026-08-05T07:04:45Z&sks=b&skv=2026-02-06&sig=Z%2BNYIUc1AWShORLNFQkkVv8gLHgMeizD%2BcE5vHPyFAQ%3D' -o assets/audio/sybille-takeover-interference.mp3
          echo '1937a49dda57159a8fb880b3ab3545127287e42fbcb70bf13f4eac9c38903822  assets/audio/ioti-titan-pulse-v1-dark.mp3' | sha256sum -c -
          echo 'd5010f59681023d682b771abac46dd8c98ab8c0e3c355f14f92805441b78d524  assets/audio/sybille-takeover-interference.mp3' | sha256sum -c -
      - name: Commit verified audio v2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/audio/ioti-titan-pulse-v1-dark.mp3 assets/audio/sybille-takeover-interference.mp3
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Replace Sybille takeover audio with interference and darker AI loop'
          git push
