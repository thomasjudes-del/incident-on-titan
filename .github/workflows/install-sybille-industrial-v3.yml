name: Install verified Sybille industrial loop v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Sybille industrial loop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7214-81f4-815c-b731dfc0d1d8/raw?se=2026-08-04T12:37:39Z&sp=r&sv=2026-02-06&sr=b&scid=46b089e5-deb5-58e8-ba0b-55f82f6baa9c&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T05:03:59Z&ske=2026-08-05T05:03:59Z&sks=b&skv=2026-02-06&sig=Bx2mKZSnOV%2BqCLJTbrzDldDHiDCOweo3/GMsW0axLwM%3D' -o assets/audio/ioti-titan-pulse-v1-dark.mp3
          echo '242d88712fcfa3d37cbeeccd2d067ef9cee6def680eb497db801c37201743997  assets/audio/ioti-titan-pulse-v1-dark.mp3' | sha256sum -c -
      - name: Commit verified Sybille industrial loop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/audio/ioti-titan-pulse-v1-dark.mp3
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Replace Sybille loop with industrial dark mix v3'
          git push
